<script>
    const KEY = "7144d152ee36ab05977e3993d9f68470";
    const HEADERS = { "x-rapidapi-host": "v3.football.api-sports.io", "x-apisports-key": KEY };
    const FCE_ID = 200;
    const LEAGUE_ID = 72;
    const SEASON = 2025; // This is the season that just finished

    async function init() {
        console.log("Fetching data for May 2026...");
        
        // 1. Fetch Match Data
        try {
            const resM = await fetch(`https://v3.football.api-sports.io/fixtures?team=${FCE_ID}&last=1`, { headers: HEADERS });
            const dataM = await resM.json();
            const matchContainer = document.getElementById('match-data');

            if (dataM.response && dataM.response.length > 0) {
                const m = dataM.response[0];
                matchContainer.innerHTML = `
                    <div class="score-box">
                        <div class="team"><img src="${m.teams.home.logo}" width="50"><p>${m.teams.home.name}</p></div>
                        <div class="result">${m.goals.home} - ${m.goals.away}</div>
                        <div class="team"><img src="${m.teams.away.logo}" width="50"><p>${m.teams.away.name}</p></div>
                    </div>`;
            } else {
                matchContainer.innerHTML = "<p style='color:#888;'>Season recently ended. Awaiting new fixtures.</p>";
            }
        } catch(e) { console.error("Match Error:", e); }

        // 2. Fetch Standings
        try {
            const resS = await fetch(`https://v3.football.api-sports.io/standings?league=${LEAGUE_ID}&season=${SEASON}`, { headers: HEADERS });
            const dataS = await resS.json();
            const tableBody = document.getElementById('standings-data');

            // Safety Gate: Check if response exists before reading it
            if (dataS.response && dataS.response.length > 0 && dataS.response[0].league.standings) {
                const list = dataS.response[0].league.standings[0];
                let rows = "";
                list.forEach(t => {
                    const isFCE = t.team.id === FCE_ID ? "class='fce-row'" : "";
                    rows += `<tr ${isFCE}>
                        <td>${t.rank}</td>
                        <td style="text-align:left">${t.team.name}</td>
                        <td>${t.all.played}</td>
                        <td><strong>${t.points}</strong></td>
                    </tr>`;
                });
                tableBody.innerHTML = rows;
            } else {
                tableBody.innerHTML = "<tr><td colspan='4'>Standings for " + SEASON + " are being updated by the league.</td></tr>";
            }
        } catch(e) { 
            console.error("Standings Error:", e);
            document.getElementById('standings-data').innerHTML = "<tr><td colspan='4'>Connection Error.</td></tr>";
        }
    }

    init();
</script>
