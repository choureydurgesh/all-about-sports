<!DOCTYPE html>
<html>
<head>
    <title>My Football Club PoC</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #001e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .match-center { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .player-card { background: white; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 5px solid #ef4123; }
        .player-card img { width: 100%; border-radius: 5px; }
    </style>
</head>
<body>
    <header><h1>CITY UNITED FOOTBALL CLUB</h1></header>
    <div class="container">
        <div class="match-center">
            <h2>NEXT MATCH</h2>
            <p><strong>City United vs. Rival FC</strong></p>
            <p>Sunday, May 10th | 10:00 AM</p>
        </div>
        <h2>SQUAD</h2>
        <div class="grid">
            <div class="player-card">
                <img src="https://via.placeholder.com/150" alt="Player">
                <h3>John Doe</h3>
                <p>Forward | 12 Goals</p>
            </div>
            <!-- Add more cards here -->
        </div>
    </div>
</body>
</html>
