<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 | Fan Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="team-nav">
        <img src="https://www.thesportsdb.com/images/media/team/badge/7f5e8f15201198.png" 
             class="nav-logo" onclick="handleTeamClick(31)" alt="MI">
        <img src="https://www.thesportsdb.com/images/media/team/badge/yutvtr14201198.png" 
             class="nav-logo" onclick="handleTeamClick(1)" alt="CSK">
        <img src="https://www.thesportsdb.com/images/media/team/badge/f1388015510000.png" 
             class="nav-logo" onclick="handleTeamClick(5)" alt="RCB">
    </div>
</header>

<main class="container">
    <div id="display-area">
        <div class="welcome-msg">
            <h2>Welcome to IPL 2026</h2>
            <p>Click a team logo above to view real-time player performance.</p>
        </div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
