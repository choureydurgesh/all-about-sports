<div id="match-data"></div>
<table><tbody id="standings-data"></tbody></table>

<script>
    // This wrapper ensures the page is ready
    document.addEventListener("DOMContentLoaded", function() {
        
        const KEY = "7144d152ee36ab05977e3993d9f68470";
        const HEADERS = { "x-rapidapi-host": "v3.football.api-sports.io", "x-apisports-key": KEY };
        const FCE_ID = 200;
        const LEAGUE_ID = 72;
        const SEASON = 2025;

        async function init() {
            // MATCH DATA
            try {
                const resM = await fetch(`https://v3.football.api-sports.io/fixtures?team=${FCE_ID}&last=1`, { headers: HEADERS });
                const dataM = await resM.json();
                const matchContainer = document.getElementById('match-data');

                if (matchContainer && dataM.response && dataM.response.length > 0) {
                    const m = dataM.response[0];
                    matchContainer.innerHTML = `<div>${m.teams.home.name} ${m.goals.home} - ${m.goals.away} ${m.teams.away.name}</div>`;
                } else if (matchContainer) {
                    matchContainer.innerHTML = "No recent matches found.";
                }
            } catch(e) { console.error("Match Error:", e); }

            // STANDINGS DATA
            try {
                const resS = await fetch(`https://v3.football.api-sports.io/standings?league=${LEAGUE_ID}&season=${SEASON}`, { headers: HEADERS });
                const dataS = await resS.json();
                const tableBody = document.getElementById('standings-data');

                if (tableBody && dataS.response && dataS.response.length > 0) {
                    const list = dataS.response[0].league.standings[0];
                    let rows = "";
                    list.forEach(t => {
                        rows += `<tr><td>${t.rank}</td><td>${t.team.name}</td><td>${t.points}</td></tr>`;
                    });
                    tableBody.innerHTML = rows;
                } else if (tableBody) {
                    tableBody.innerHTML = "<tr><td colspan='3'>Standings not available for this season.</td></tr>";
                }
            } catch(e) { console.error("Standings Error:", e); }
        }

        init();
    });
</script>
